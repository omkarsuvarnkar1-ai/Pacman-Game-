<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pac-Man — Midnight Maze</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');
:root{color-scheme:dark;--ink:#080b19;--blue:#192c91;--cyan:#54e8ff;--yellow:#ffe44d;--muted:#8590ba}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#182457 0%,#0d1330 35%,var(--ink) 78%);color:#fff;font-family:'Space Mono',monospace;display:flex;justify-content:center;align-items:center;padding:24px}
.cabinet{width:min(100%,780px);text-align:center}.eyebrow{font-size:10px;letter-spacing:.3em;color:var(--cyan);margin:0 0 12px}.title{font:clamp(24px,5vw,42px) 'Press Start 2P',monospace;color:var(--yellow);text-shadow:0 4px #9b6717,0 0 28px #ffdc4966;margin:0 0 22px}.hud{display:flex;justify-content:space-between;align-items:center;margin:0 auto 12px;max-width:640px;text-transform:uppercase;font-size:11px;letter-spacing:.08em;color:var(--muted)}.hud strong{display:block;color:#fff;font-size:17px;margin-top:5px}.lives{color:var(--yellow);font-size:19px;letter-spacing:3px}.board{position:relative;margin:auto;width:min(100%,640px);padding:12px;border:1px solid #31418d;border-radius:10px;background:#050817;box-shadow:0 0 0 5px #111b4a,0 20px 80px #000b,0 0 44px #1c4bed2c}.board canvas{display:block;width:100%;height:auto;border-radius:4px;image-rendering:pixelated}.overlay{position:absolute;inset:12px;display:grid;place-items:center;background:#030615d9;backdrop-filter:blur(3px);border-radius:4px}.overlay.hidden{display:none}.card{padding:20px}.card h2{font:16px 'Press Start 2P',monospace;color:var(--yellow);line-height:1.8}.card p{color:#c4c9dc;font-size:13px;line-height:1.8}.btn{border:0;border-radius:5px;background:var(--yellow);color:#191628;padding:13px 20px;font:12px 'Press Start 2P',monospace;cursor:pointer;box-shadow:0 4px #a47913}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.controls{color:var(--muted);font-size:11px;margin:22px 0 0;line-height:2}.keys{display:inline-flex;gap:4px;vertical-align:middle;margin:0 5px}.key{border:1px solid #44518b;border-radius:4px;padding:2px 7px;color:#e8ebfa;background:#151c3a}.mobile{display:none;margin:14px auto 0;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);gap:5px;width:max-content}.mobile button{border:1px solid #354586;background:#151c3a;color:white;border-radius:6px;font-size:18px}.mobile button:nth-child(1){grid-column:2}.mobile button:nth-child(2){grid-row:2;grid-column:1}.mobile button:nth-child(3){grid-row:2;grid-column:2}.mobile button:nth-child(4){grid-row:2;grid-column:3}@media(max-width:650px){body{padding:18px 12px}.hud{font-size:9px}.hud strong{font-size:14px}.controls{font-size:10px}.mobile{display:grid}}
.sound{margin:0 auto 10px;border:1px solid #354586;background:#151c3a;color:#dce3ff;border-radius:5px;padding:7px 10px;font:10px 'Space Mono',monospace;cursor:pointer}.sound:hover{border-color:var(--cyan)}</style></head>
<body><main class="cabinet"><p class="eyebrow">★ ARCADE CLASSIC · 01 ★</p><h1 class="title">PAC-MAN</h1>
<section class="hud"><div>SCORE<strong id="score">000000</strong></div><div>BEST<strong id="best">000000</strong></div><div class="lives" id="lives">● ● ●</div></section>
<div class="board"><canvas id="game" width="560" height="620" aria-label="Pac-Man maze game"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="message">READY?</h2><p id="submessage">Clear the maze. Dodge the ghosts.<br>Power pellets turn the tables.</p><button class="btn" id="start">START GAME</button></div></div></div>
<button class="sound" id="music" type="button" aria-pressed="false">♫ MUSIC: OFF</button><div class="mobile" aria-label="Touch controls"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
<p class="controls"><span class="keys"><span class="key">←</span><span class="key">↑</span><span class="key">↓</span><span class="key">→</span></span> or <span class="key">W A S D</span> to move <span style="padding:0 8px">·</span> <span class="key">SPACE</span> to pause</p></main>
<script>
(()=>{
const mapText=[
'###################','#........#........#','#.##.###.#.###.##.#','#o##.###.#.###.##o#','#.................#','#.##.#.#####.#.##.#','#....#...#...#....#','####.###.#.###.####','####.#.......#.####','####.#.## ##.#.####','.......#G#.........','####.#.#####.#.####','####.#.......#.####','####.#.#####.#.####','#........#........#','#.##.###.#.###.##.#','#o.#.....P.....#.o#','##.#.#.#####.#.#.##','#....#...#...#....#','#.######.#.######.#','#.................#','###################'
];
// Keep the maze dimensions aligned with the canvas tile grid.
const rows=mapText.map(s=>s.replace(/ /g,''));const W=19,H=22,T=28,canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
let grid=[],pellets=0,score=0,lives=3,pac={x:9,y:16,dir:'left',want:'left',mouth:0},ghosts=[],running=false,paused=false,won=false,last=0,acc=0;
const dirs={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]},colors=['#ff5579','#ff9be8','#51e9ff','#ffa64d'];
const bestEl=document.querySelector('#best');let best=+(localStorage.getItem('midnight-pac-best')||0);bestEl.textContent=String(best).padStart(6,'0');
let audioContext=null,musicTimer=null,musicOn=false,musicStep=0;
const melody=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,987.77,880,783.99,698.46,659.25];
function playTone(freq,duration,type='square',volume=.035){if(!audioContext||audioContext.state!=='running')return;const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(volume,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);osc.connect(gain);gain.connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+duration)}
function startMusic(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();if(musicTimer)clearInterval(musicTimer);musicOn=true;document.querySelector('#music').textContent='♫ MUSIC: ON';document.querySelector('#music').setAttribute('aria-pressed','true');musicStep=0;const tick=()=>{const note=melody[musicStep%melody.length];playTone(note,.13);if(musicStep%4===0)playTone(note/2,.2,'triangle',.025);musicStep++};tick();musicTimer=setInterval(tick,170)}
function stopMusic(){musicOn=false;if(musicTimer){clearInterval(musicTimer);musicTimer=null}if(audioContext)audioContext.suspend();document.querySelector('#music').textContent='♫ MUSIC: OFF';document.querySelector('#music').setAttribute('aria-pressed','false')}
document.querySelector('#music').addEventListener('click',()=>musicOn?stopMusic():startMusic());
function init(){modeClock=0;mode='scatter';frightClock=0;grid=rows.map(s=>s.split(''));pellets=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(grid[y][x]==='.')pellets++;if(grid[y][x]==='o')pellets++;if(grid[y][x]==='P'){pac.x=x;pac.y=y;grid[y][x]=' ';}}ghosts=ghostHomes.map((h,i)=>({x:h.x,y:h.y,color:colors[i],dir:['left','right','up','down'][i],home:i,fright:0,returning:false}));}
function wall(x,y){if(y<0||y>=H)return true;if(x<0||x>=W)return false;return grid[y][x]==='#'}
function can(x,y,d){let [dx,dy]=dirs[d];return !wall(x+dx,y+dy)}
function move(entity,d){let [dx,dy]=dirs[d];entity.x+=dx;entity.y+=dy;if(entity.x<0)entity.x=W-1;if(entity.x>=W)entity.x=0;entity.dir=d}
function tileCenter(entity){return Math.abs(entity.x-Math.round(entity.x))<.001&&Math.abs(entity.y-Math.round(entity.y))<.001}
function advance(entity,distance){const [dx,dy]=dirs[entity.dir];if(dx){const target=dx>0?Math.floor(entity.x+.000001)+1:Math.ceil(entity.x-.000001)-1,delta=target-entity.x;entity.x+=Math.sign(delta)*Math.min(distance,Math.abs(delta));if(Math.abs(entity.x-target)<.001){entity.x=target;if(target<0)entity.x=W-1;if(target>=W)entity.x=0}}else{const target=dy>0?Math.floor(entity.y+.000001)+1:Math.ceil(entity.y-.000001)-1,delta=target-entity.y;entity.y+=Math.sign(delta)*Math.min(distance,Math.abs(delta));if(Math.abs(entity.y-target)<.001)entity.y=target}}
const ghostHomes=[{x:9,y:10},{x:8,y:10},{x:10,y:10},{x:9,y:9}],corners=[{x:17,y:1},{x:1,y:1},{x:17,y:20},{x:1,y:20}];
let modeClock=0,mode='scatter',frightClock=0;
function astar(sx,sy,tx,ty){const key=(x,y)=>`${x},${y}`,open=[{x:sx,y:sy,g:0,f:Math.abs(tx-sx)+Math.abs(ty-sy),first:null}],cost=new Map([[key(sx,sy),0]]),closed=new Set();while(open.length){open.sort((a,b)=>a.f-b.f);const n=open.shift(),nk=key(n.x,n.y);if(closed.has(nk))continue;if(n.x===tx&&n.y===ty)return n.first;closed.add(nk);for(const d of Object.keys(dirs)){const [dx,dy]=dirs[d],x=n.x+dx,y=n.y+dy,k=key(x,y);if(x<0||x>=W||y<0||y>=H||wall(x,y)||closed.has(k))continue;const g=n.g+1;if(g<(cost.get(k)??Infinity)){cost.set(k,g);const h=Math.abs(tx-x)+Math.abs(ty-y);open.push({x,y,g,f:g+h,first:n.first||d})}}}return null}
function ghostTarget(g,i){if(g.returning)return ghostHomes[i];if(mode==='scatter')return corners[i];let px=Math.round(pac.x),py=Math.round(pac.y),[dx,dy]=dirs[pac.dir];if(i===0)return{x:px,y:py};if(i===1)return{x:px+dx*4,y:py+dy*4};if(i===2){const lead={x:px+dx*2,y:py+dy*2},blinky=ghosts[0];return{x:lead.x+(lead.x-Math.round(blinky.x)),y:lead.y+(lead.y-Math.round(blinky.y))}}const dist=Math.abs(Math.round(g.x)-px)+Math.abs(Math.round(g.y)-py);return dist>8?{x:px,y:py}:corners[i]}
function step(){modeClock+=.1;if(modeClock>(mode==='scatter'?7:20)){mode=mode==='scatter'?'chase':'scatter';modeClock=0}if(frightClock>0)frightClock=Math.max(0,frightClock-.1);if(tileCenter(pac)&&can(Math.round(pac.x),Math.round(pac.y),pac.want))pac.dir=pac.want;if(tileCenter(pac)){const x=Math.round(pac.x),y=Math.round(pac.y);if(can(x,y,pac.dir)){const c=grid[y][x];if(c==='.'||c==='o'){score+=c==='o'?50:10;grid[y][x]=' ';pellets--;if(c==='o'){frightClock=7;ghosts.forEach(g=>{if(!g.returning)g.fright=7})}if(score>best){best=score;localStorage.setItem('midnight-pac-best',best)}if(!pellets){finish(true);return}}}}if(!tileCenter(pac)||can(Math.round(pac.x),Math.round(pac.y),pac.dir))advance(pac,.105);
for(let i=0;i<ghosts.length;i++){const g=ghosts[i];if(!tileCenter(g)){advance(g,.075);continue}const gx=Math.round(g.x),gy=Math.round(g.y);if(g.returning&&gx===ghostHomes[i].x&&gy===ghostHomes[i].y){g.returning=false;g.fright=0}let choices=Object.keys(dirs).filter(d=>can(gx,gy,d));if(choices.length){const reverse={left:'right',right:'left',up:'down',down:'up'}[g.dir];let legal=choices.filter(d=>d!==reverse);if(!legal.length)legal=choices;let chosen;if(frightClock>0&&!g.returning)chosen=legal[Math.floor(Math.random()*legal.length)];else{const target=ghostTarget(g,i),ranked=legal.map(d=>{const [dx,dy]=dirs[d],x=gx+dx,y=gy+dy;return{d,dist:Math.abs(target.x-x)+Math.abs(target.y-y)}}).sort((a,b)=>a.dist-b.dist);chosen=astar(gx,gy,target.x,target.y)||ranked[0].d}g.dir=chosen;const speed=g.returning?.12:.075;advance(g,speed)}if(Math.hypot(g.x-pac.x,g.y-pac.y)<.62){if(frightClock>0&&!g.returning){score+=200;g.returning=true;g.fright=0}else if(!g.returning){loseLife();return}}g.fright=frightClock>0&&!g.returning?frightClock:0}
document.querySelector('#score').textContent=String(score).padStart(6,'0');document.querySelector('#best').textContent=String(best).padStart(6,'0');document.querySelector('#lives').textContent=Array.from({length:lives},()=> '●').join(' ')}
function draw(){ctx.fillStyle='#050817';ctx.fillRect(0,0,canvas.width,canvas.height);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c=grid[y][x],px=x*T,py=y*T;if(c==='#'){ctx.fillStyle='#101b56';ctx.fillRect(px,py,T,T);ctx.strokeStyle='#2d52ed';ctx.lineWidth=2;ctx.strokeRect(px+2,py+2,T-4,T-4);ctx.fillStyle='#121d5b';ctx.fillRect(px+5,py+5,T-10,T-10)}else if(c==='.'||c==='o'){ctx.fillStyle=c==='o'?'#fff3a1':'#ffdfac';ctx.beginPath();ctx.arc(px+T/2,py+T/2,c==='o'?6:2.5,0,Math.PI*2);ctx.fill();if(c==='o'){ctx.shadowBlur=15;ctx.shadowColor='#fff3a1';ctx.fill();ctx.shadowBlur=0}}}
let angle=Math.sin(pac.mouth)*.3+.42,rot={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[pac.dir];ctx.fillStyle='#ffe44d';ctx.shadowBlur=20;ctx.shadowColor='#ffe44d';ctx.beginPath();ctx.moveTo(pac.x*T+T/2,pac.y*T+T/2);ctx.arc(pac.x*T+T/2,pac.y*T+T/2,T*.43,rot+angle,rot+Math.PI*2-angle);ctx.closePath();ctx.fill();ctx.shadowBlur=0;pac.mouth+=.2;
for(const g of ghosts){let x=g.x*T+T/2,y=g.y*T+T/2;ctx.fillStyle=g.fright?'#3656c9':g.color;ctx.shadowBlur=12;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(x,y,T*.42,Math.PI,0);ctx.lineTo(x+T*.42,y+T*.38);for(let i=0;i<3;i++){ctx.lineTo(x+T*(.28-i*.28),y+T*.25);ctx.lineTo(x+T*(.14-i*.28),y+T*.38)}ctx.lineTo(x-T*.42,y);ctx.fill();ctx.shadowBlur=0;for(let ex of [-5,5]){ctx.fillStyle='white';ctx.beginPath();ctx.ellipse(x+ex,y-2,4,5,0,0,7);ctx.fill();ctx.fillStyle='#15245a';ctx.beginPath();ctx.arc(x+ex+(dirs[g.dir][0]*2),y-2+(dirs[g.dir][1]*2),2,0,7);ctx.fill()}}
}
function loop(ts){if(!running)return;let dt=Math.min(ts-last,50);last=ts;if(!paused){acc+=dt;while(acc>100){step();acc-=100}}draw();requestAnimationFrame(loop)}
function start(){init();score=0;lives=3;paused=false;running=true;document.querySelector('#overlay').classList.add('hidden');document.querySelector('#score').textContent='000000';last=performance.now();requestAnimationFrame(loop)}
function finish(win){running=false;document.querySelector('#message').textContent=win?'MAZE CLEARED!':'GAME OVER';document.querySelector('#submessage').textContent=win?'Every dot, every corner. Nice run!':'The ghosts got you. One more run?';document.querySelector('#start').textContent='PLAY AGAIN';document.querySelector('#overlay').classList.remove('hidden')}
function loseLife(){lives--;if(lives<=0){finish(false);return}pac.x=9;pac.y=16;pac.dir='left';pac.want='left';ghosts.forEach((g,i)=>{g.x=ghostHomes[i].x;g.y=ghostHomes[i].y;g.fright=0;g.returning=false})}
document.querySelector('#start').addEventListener('click',()=>{if(paused){paused=false;document.querySelector('#overlay').classList.add('hidden')}else start()});window.addEventListener('keydown',e=>{let k={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'}[e.key];if(k){e.preventDefault();pac.want=k}if(e.code==='Space'&&running){e.preventDefault();paused=!paused;document.querySelector('#message').textContent=paused?'PAUSED':'READY?';document.querySelector('#start').textContent=paused?'RESUME':'START GAME';document.querySelector('#overlay').classList.toggle('hidden',!paused)}});document.querySelectorAll('[data-dir]').forEach(b=>{let set=()=>pac.want=b.dataset.dir;b.addEventListener('pointerdown',set)});init();draw();
})();
</script></body></html>
